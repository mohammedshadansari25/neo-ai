[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neo-ai-backend"
version = "0.1.0"
description = "Neo AI V1 Modular Monolith Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "psycopg[binary]>=3.2.0",
    "psycopg-pool>=3.2.0",
    "pgvector>=0.3.6",
    "alembic>=1.13.0",
    "celery[redis]>=5.4.0",
    "redis>=5.0.0",
    "httpx>=0.27.0",
    "pymupdf>=1.24.0",
    "pillow>=10.4.0",
    "trafilatura>=1.12.0",
    "youtube-transcript-api>=0.6.2",
    "langgraph>=1.0.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "openai>=1.50.0",
    "google-genai>=0.5.0",
    "python-multipart>=0.0.9",
    "pyjwt>=2.9.0",
    "bcrypt>=4.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
python_files = ["test_*.py", "spike_*.py"]
testpaths = ["tests"]

[tool.ruff.lint]
ignore = ["B008"]
