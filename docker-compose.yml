services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: neo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-neo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-neo_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-neodb}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-neo} -d ${POSTGRES_DB:-neodb}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - neo-net

  redis:
    image: redis:7-alpine
    container_name: neo-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - neo-net

  backend:
    build:
      context: ./backend
    container_name: neo-backend
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./backend:/app
      - neo_uploads:/app/data/uploads
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - neo-net

  worker:
    build:
      context: ./backend
    container_name: neo-worker
    restart: unless-stopped
    command: ["celery", "-A", "app.worker.celery_app:celery_app", "worker", "--loglevel=info", "--concurrency=2"]
    env_file: .env
    volumes:
      - ./backend:/app
      - neo_uploads:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - neo-net

volumes:
  postgres_data:
  redis_data:
  neo_uploads:

networks:
  neo-net:
    driver: bridge
