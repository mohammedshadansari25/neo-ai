name: Neo AI V1 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: neo
          POSTGRES_PASSWORD: neo
          POSTGRES_DB: neodb_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - "6379:6379"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: cd backend && pip install -e ".[dev]"
      - name: Lint and format check
        run: cd backend && ruff check .
      - name: Run migrations and backend tests
        env:
          DATABASE_ASYNC_URL: postgresql+asyncpg://neo:neo@localhost:5432/neodb_test
          DATABASE_SYNC_URL: postgresql+psycopg://neo:neo@localhost:5432/neodb_test
          REDIS_URL: redis://localhost:6379/0
        run: cd backend && alembic upgrade head && pytest -q tests/backend

  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install, typecheck, and build
        run: cd frontend && npm ci && npm run typecheck && npm run build
